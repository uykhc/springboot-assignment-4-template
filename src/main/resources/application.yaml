spring:
  datasource:
    url: jdbc:mysql://mysql.seminar.svc.cluster.local:3306/everytimedb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul
    username: everytime
    password: everytimepw
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true

  data:
    redis:
      host: redis.seminar.svc.cluster.local
      port: 6379
      timeout: 2000

jwt:
  secret: this-is-a-very-long-and-secure-secret-key-for-jwt-token-generation
  expiration-in-ms: 86400000

logging:
  level:
    org:
      springframework:
        data:
          jdbc: DEBUG
        jdbc:
          core:
            JdbcTemplate: DEBUG
            namedparam:
              NamedParameterJdbcTemplate: TRACE
