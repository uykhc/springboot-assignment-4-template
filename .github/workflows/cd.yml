name: CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/everytime-clone:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/everytime-clone:latest

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push-image

    steps:
      - name: Connect to EC2 and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 새 이미지로 Deployment 업데이트
            kubectl set image deployment/seminar-app \
              seminar-app=${{ secrets.DOCKERHUB_USERNAME }}/everytime-clone:${{ github.sha }} \
              -n seminar

            # 롤아웃 완료될 때까지 대기
            kubectl rollout status deployment/seminar-app -n seminar
